# sla_manifest.yaml — HARD GATE §8 do protocolo Etapa 2.5 SQR-JC.
# Valores EXTRAÍDOS DO CÓDIGO CONGELADO da Rodada 2 (nunca inventados):
#   - oracle/dataset.py:71-73  (SLA_EMBB_MBPS=3.5, SLA_URLLC_MS=10.0, SLA_MMTC_PDR=0.95)
#   - oracle/adjudication.py::_sla_oks (julgamento de janela do Gate 2.4-II-d)
#   - oracle/dataset.py::_read_kpm_windows / _urllc_packet_windows (agregação exata)
#   - registers R35-R38 de MODA/docs/sqr/assumptions_register.md
# Direção do KPI: eMBB maior-é-melhor; URLLC menor-é-melhor; mMTC maior-é-melhor.
# Margem primária: UMA definição por slice, conforme o código auditado (protocolo §7).
# DIVERGÊNCIA REGISTRADA (protocolo §0): o despacho pre-flight pedia "miss<=5"
# como critério URLLC do Gate II-d; o código congelado usou p95<=10 ms
# (adjudication.py:404-412, models.py:222) — miss_pct é métrica de relatório
# em toda a Rodada 2, nunca gate.  Primária = p95 (conforme código auditado);
# a variante miss fica como SECUNDÁRIA.  Trocar exige decisão do orquestrador.
# Janela: stamp do KPI = (t+1)*100 ms da ação que governou (adjudication.py:343).
# Vácuo (sem demanda na slice) = satisfeito (adjudication.py:404-412, R19).
sla_manifest_version: '1.0'
protocol: SQRJC-ETAPA-2.5-FINAL
frozen_from: Rodada-2-codigo-congelado
decision_period_ms: 100
kpi_stamp_rule: outcome_window_governing_action_plus_1
embb:
  slice_id: 0
  profile: greedy UDP full-buffer 100 Mbps/UE (R04)
  kpi: median of windowThroughputMbps over demand UE-windows of the governed window
  kpi_source: sqr-kpms.txt col. 11 (contract §4)
  unit: Mbps
  temporal_aggregation: one 100 ms decision window; stamp (t+1)*100 ms
  per_ue_aggregation: median across UE-windows with demand (dTxBytes > 0)
  threshold: 3.5
  threshold_register: R36 as amended (operational; source target 7 Mbps DORA Eq.5)
  direction: higher_is_better
  margin_formula: m_e = (T_e - 3.5) / 3.5
  vacuous_policy: no demand -> satisfied (None -> None)
  violation_predicate: T_e < 3.5
urllc:
  slice_id: 1
  profile: UDP CBR 32 B every 1 ms per UE (R35; 0.256 Mbps/UE)
  kpi: per-window p95 of URLLC packet delays (ms), packets grouped by ARRIVAL window
  kpi_source: sqr_packet_delays.csv delaySec (R32); win = floor(txSec * 10)
  unit: ms
  temporal_aggregation: one 100 ms decision window by arrival window
  per_ue_aggregation: pooled across URLLC packets of the window
  threshold: 10.0
  threshold_register: R37 (deadline app-to-app experimental)
  direction: lower_is_better
  margin_formula: m_u = (10 - p95_ms) / 10
  vacuous_policy: no packets in window -> satisfied
  violation_predicate: p95_ms > 10.0
  secondary_metric: deadline-miss ratio = fraction of packets with delaySec > 0.010 (percent)
  secondary_threshold_pct: 5.0
  secondary_margin_formula: m_u_miss = (5 - miss_pct) / 5
  secondary_status: REPORT_ONLY (never a gate in the audited Round-2 code; divergence registered)
mmtc:
  slice_id: 2
  profile: UDP CBR 200 B every 1000 ms per UE (R35; 0.0016 Mbps/UE)
  kpi: 1 s ROLLING PDR = sum(dRxPackets) / sum(dTxPackets) over the last 10 windows
  kpi_source: sqr-kpms.txt cols 14-15 (contract v1.3)
  unit: fraction
  temporal_aggregation: rolling 10 windows (1 s), per decision window
  per_ue_aggregation: pooled packet counts of the slice
  threshold: 0.95
  threshold_register: R38 (assumed; session PDR analog)
  direction: higher_is_better
  margin_formula: m_m = (PDR - 0.95) / 0.95
  vacuous_policy: no tx in the rolling window -> satisfied
  violation_predicate: PDR < 0.95
severity_rule: severity_i = max(0, -m_i) (protocol §63; margin scale, comparable across slices)
